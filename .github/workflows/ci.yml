name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no moving major tag, so the exact release is pinned.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Built so the Docker sandbox tests, including the no-network check, run in CI.
      - name: Build sandbox image
        run: docker build -t aca-sandbox:py312 sandbox

      # Tests use the mock provider only. No API key is configured or needed.
      - name: Test
        run: uv run pytest
